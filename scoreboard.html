<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard | CTS fantasy WC '26</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .bracket-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; align-items:center; justify-content:center; }
    .bracket-modal.open { display:flex; }
    .bracket-modal-box { background:#fff; border-radius:10px; width:96vw; max-width:1100px; height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,.25); }
    .bracket-modal-header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid #e8f5e9; flex-shrink:0; }
    .bracket-modal-header span { font-weight:700; color:#1b4332; }
    .bracket-modal-close { border:none; background:none; font-size:1.4rem; cursor:pointer; color:#555; line-height:1; }
    .bracket-modal-close:hover { color:#c62828; }
    .bracket-modal iframe { flex:1; border:none; width:100%; }
  </style>
</head>
<body>
  <div class="bracket-modal" id="bracketModal">
    <div class="bracket-modal-box">
      <div class="bracket-modal-header">
        <span id="bracketModalTitle">Pavouk</span>
        <button class="bracket-modal-close" id="bracketModalClose">✕</button>
      </div>
      <iframe id="bracketModalFrame" src="" title="Pavouk"></iframe>
    </div>
  </div>
  <header class="topbar">
    <div class="brand">
      <img src="/images/cts-logo.png" alt="CTS logo">
      <span>CTS fantasy WC '26</span>
    </div>
    <nav class="nav" data-nav></nav>
  </header>
  <main class="container">
    <section class="card card--wide">
      <div class="toolbar">
        <div>
          <h1>Scoreboard</h1>
          <p id="summary">Načítám...</p>
        </div>
      </div>
      <div class="table-wrap">
        <table class="scoreboard-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Přezdívka</th>
              <th>Jméno</th>
              <th>Body</th>
              <th>Přesné výsledky</th>
              <th>Vyhodnocených tipů</th>
              <th title="Body za správný tip na nejlepšího střelce (+5 b) a asistenta (+5 b) turnaje">Potenciální body</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="scoreRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module">
    import { api, escapeHtml, flagSpan, formatKickoff } from '/common.js';

    const rows = document.getElementById('scoreRows');
    const summary = document.getElementById('summary');
    const openRows = new Set();

    const SECTION_ORDER = ['1. kolo skupinové fáze', '2. kolo skupinové fáze', '3. kolo skupinové fáze', 'Vyřazovací fáze'];

    function matchSection(round) {
      const num = parseInt((round || '').replace('Matchday ', ''), 10);
      if (!isNaN(num)) {
        if (num <= 7) return '1. kolo skupinové fáze';
        if (num <= 13) return '2. kolo skupinové fáze';
        return '3. kolo skupinové fáze';
      }
      return 'Vyřazovací fáze';
    }

    async function load() {
      const data = await api('/api/scoreboard');
      const { topScorer, topAssister } = data;
      const fmtLeaders = (players) => players.map(escapeHtml).join(', ');
      const scorerInfo = topScorer ? ` &nbsp;·&nbsp; ⚽ Střelec: <b>${fmtLeaders(topScorer.players)}</b> (${topScorer.goals} gólů)` : '';
      const assisterInfo = topAssister ? ` &nbsp;·&nbsp; 🎯 Asistent: <b>${fmtLeaders(topAssister.players)}</b> (${topAssister.assists} asistencí)` : '';
      summary.innerHTML = `${data.finishedMatches} vyhodnocených zápasů.${scorerInfo}${assisterInfo}`;
      if (!data.users.length) {
        rows.innerHTML = `<tr><td colspan="7" class="muted">Zatím žádní hráči.</td></tr>`;
        return;
      }
      rows.innerHTML = data.users.map((user, index) => {
        const badges = [
          user.scorerHit ? '<span class="pot-badge scorer">⚽ +5</span>' : '',
          user.assisterHit ? '<span class="pot-badge assister">🎯 +5</span>' : '',
        ].filter(Boolean).join('');
        const potCell = badges
          ? `<td class="potential-cell">${badges}</td>`
          : `<td class="muted potential-miss">—</td>`;
        return `
        <tr class="scoreboard-row" data-user-id="${user.userId}" style="cursor:pointer">
          <td class="rank">${index + 1}${user.rankDelta != null && user.rankDelta !== 0 ? `<span class="rank-delta ${user.rankDelta > 0 ? 'delta-up' : 'delta-down'}">${user.rankDelta > 0 ? '+' : ''}${user.rankDelta}</span>` : ''}</td>
          <td><b>${escapeHtml(user.nickname)}</b></td>
          <td>${escapeHtml(user.name)}</td>
          <td class="points">${user.totalPoints}</td>
          <td>${user.exactScores}</td>
          <td>${user.scoredTips}</td>
          ${potCell}
          <td><button class="btn-bracket" data-bracket-btn data-user-id="${user.userId}" data-nickname="${escapeHtml(user.nickname)}">🕸 Pavouk</button></td>
        </tr>
        <tr class="detail-row" id="detail-${user.userId}" style="display:none">
          <td colspan="8" class="detail-cell">
            <div class="detail-loading">Načítám...</div>
          </td>
        </tr>`;
      }).join('');

      document.querySelectorAll('.scoreboard-row').forEach((row) => {
        row.addEventListener('click', () => toggleDetail(row.dataset.userId));
      });

      for (const userId of openRows) {
        const detailRow = document.getElementById(`detail-${userId}`);
        if (detailRow) {
          detailRow.style.display = '';
          loadDetail(userId);
        }
      }
    }

    async function toggleDetail(userId) {
      const detailRow = document.getElementById(`detail-${userId}`);
      if (!detailRow) return;
      const isOpen = detailRow.style.display !== 'none';
      if (isOpen) {
        detailRow.style.display = 'none';
        openRows.delete(userId);
      } else {
        detailRow.style.display = '';
        openRows.add(userId);
        await loadDetail(userId);
      }
    }

    async function loadDetail(userId) {
      const detailRow = document.getElementById(`detail-${userId}`);
      const cell = detailRow.querySelector('.detail-cell');
      try {
        const data = await api(`/api/scoreboard/${userId}/tips`);
        if (!data.tips.length) {
          cell.innerHTML = `<p class="muted" style="padding:8px 0">Žádné vyhodnocené tipy.</p>`;
          return;
        }

        const sections = new Map();
        for (const tip of data.tips) {
          const section = matchSection(tip.round);
          if (!sections.has(section)) sections.set(section, []);
          sections.get(section).push(tip);
        }

        const orderedSections = SECTION_ORDER.filter((s) => sections.has(s));
        const currentSection = orderedSections[orderedSections.length - 1];

        cell.innerHTML = orderedSections.map((section) => {
          const tips = sections.get(section);
          const collapsed = section !== currentSection;
          const sectionPoints = tips.reduce((sum, t) => sum + (t.points ?? 0), 0);
          const rows = tips.map((t) => {
            const captainBadge = t.isCaptain ? ' <span class="badge-captain">👑</span>' : '';
            const bonusBadge = t.bonusPlayer
              ? ` <span class="badge-bonus ${t.bonusHit ? 'hit' : 'miss'}" title="${escapeHtml(t.bonusPlayer)}">🎯${t.bonusHit ? '+2' : '✗'}</span>`
              : '';
            const pointsClass = t.points >= 3 ? 'points-high' : t.points >= 1 ? 'points-mid' : 'points-zero';
            return `
              <tr>
                <td>${flagSpan(t.homeFlag)} ${escapeHtml(t.teamHome)} – ${flagSpan(t.awayFlag)} ${escapeHtml(t.teamAway)}</td>
                <td class="muted">${escapeHtml(formatKickoff(t.kickoffUtc))}</td>
                <td><b>${t.actualHome}:${t.actualAway}</b></td>
                <td>${t.tipHome}:${t.tipAway}${captainBadge}${bonusBadge}</td>
                <td class="detail-points ${pointsClass}">${t.points}</td>
              </tr>`;
          }).join('');
          return `
            <div class="detail-section">
              <div class="detail-section-header" data-section-toggle="${escapeHtml(section)}">
                <span class="detail-section-title">${escapeHtml(section)}</span>
                <span class="detail-section-meta">${tips.length} tip${tips.length >= 5 ? 'ů' : tips.length >= 2 ? 'y' : ''}  ·  ${sectionPoints} b</span>
                <span class="detail-section-chevron" data-chevron>${collapsed ? '▶' : '▼'}</span>
              </div>
              <div class="detail-section-body"${collapsed ? ' style="display:none"' : ''}>
                <table class="detail-table">
                  <thead>
                    <tr><th>Zápas</th><th>Datum</th><th>Výsledek</th><th>Tip</th><th>Body</th></tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>`;
        }).join('');

        cell.querySelectorAll('[data-section-toggle]').forEach((header) => {
          header.addEventListener('click', () => {
            const body = header.nextElementSibling;
            const chevron = header.querySelector('[data-chevron]');
            const isCollapsed = body.style.display === 'none';
            body.style.display = isCollapsed ? '' : 'none';
            chevron.textContent = isCollapsed ? '▼' : '▶';
          });
        });
      } catch {
        cell.innerHTML = `<p class="muted" style="padding:8px 0">Chyba při načítání.</p>`;
      }
    }

    // ── Bracket modal ─────────────────────────────────────────────────
    const modal      = document.getElementById('bracketModal');
    const modalFrame = document.getElementById('bracketModalFrame');
    const modalTitle = document.getElementById('bracketModalTitle');
    const modalClose = document.getElementById('bracketModalClose');

    function openBracketModal(userId, nickname) {
      modalTitle.textContent = `Pavouk — ${nickname}`;
      modalFrame.src = `/bracket.html?userId=${userId}`;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeBracketModal() {
      modal.classList.remove('open');
      modalFrame.src = '';
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeBracketModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeBracketModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBracketModal(); });

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-bracket-btn]');
      if (!btn) return;
      e.stopPropagation();
      openBracketModal(btn.dataset.userId, btn.dataset.nickname);
    });

    await load();
  </script>
</body>
</html>
